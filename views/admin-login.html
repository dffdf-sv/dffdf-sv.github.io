<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DFFDF Admin Login</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;color:#fff;background:#07070b;overflow:hidden}
    body:before,body:after{content:"";position:fixed;width:48vw;height:48vw;border-radius:50%;filter:blur(70px);opacity:.35;pointer-events:none}
    body:before{background:#6246e8;left:-18vw;top:-18vw}body:after{background:#38a9ff;right:-18vw;bottom:-18vw}
    .card{position:relative;width:min(430px,100%);padding:34px;border:1px solid rgba(255,255,255,.24);border-radius:30px;background:linear-gradient(145deg,rgba(255,255,255,.18),rgba(255,255,255,.065));box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 30px 90px rgba(0,0,0,.42);backdrop-filter:blur(10px) saturate(170%);-webkit-backdrop-filter:blur(10px) saturate(170%)}
    .shine{position:absolute;inset:1px;border-radius:29px;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.14),transparent 30%,transparent 70%,rgba(255,255,255,.07));opacity:.9}
    .content{position:relative;z-index:1}.logo{font-size:13px;letter-spacing:.18em;font-weight:800;opacity:.7}.orb{width:56px;height:56px;border-radius:18px;margin-bottom:22px;background:radial-gradient(circle at 30% 25%,#fff,rgba(255,255,255,.5) 10%,rgba(98,70,232,.75) 42%,rgba(56,169,255,.35));border:1px solid rgba(255,255,255,.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 12px 30px rgba(98,70,232,.28)}
    h1{margin:0 0 8px;font-size:31px;letter-spacing:-.045em}p{margin:0 0 26px;color:#aaaab7}.field{margin:14px 0}.field label{display:block;font-size:13px;margin-bottom:7px;color:#cfcfd8}input{width:100%;padding:13px 14px;border-radius:15px;border:1px solid rgba(255,255,255,.18);outline:none;color:#fff;background:rgba(255,255,255,.075);box-shadow:inset 0 1px 0 rgba(255,255,255,.1);font:inherit}input:focus{border-color:rgba(255,255,255,.4);background:rgba(255,255,255,.11)}button{width:100%;margin-top:10px;padding:13px 16px;border:1px solid rgba(255,255,255,.28);border-radius:15px;color:#fff;background:linear-gradient(145deg,rgba(255,255,255,.23),rgba(255,255,255,.08));box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 12px 30px rgba(0,0,0,.22);cursor:pointer;font:600 15px inherit;transition:transform .2s ease,background .2s ease}button:hover{transform:translateY(-1px);background:linear-gradient(145deg,rgba(255,255,255,.29),rgba(255,255,255,.11))}button:disabled{opacity:.6;cursor:wait;transform:none}.error{min-height:20px;margin-top:12px;color:#ff9ca9;font-size:13px}
  </style>
</head>
<body>
  <main class="card"><div class="shine"></div><div class="content">
    <div class="orb"></div><div class="logo">DFFDF ADMIN</div>
    <h1>Welcome back.</h1><p>Sign in to manage your site.</p>
    <form id="loginForm" autocomplete="on">
      <div class="field"><label for="username">Username</label><input id="username" name="username" autocomplete="username" required></div>
      <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
      <button id="submit" type="submit">Sign in</button><div class="error" id="error" role="alert"></div>
    </form>
  </div></main>
  <script>
    const form=document.getElementById('loginForm'),button=document.getElementById('submit'),error=document.getElementById('error');
    form.addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;button.textContent='Signing in…';error.textContent='';try{const r=await fetch('/api/login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:form.username.value,password:form.password.value}),cache:'no-store'});const d=await r.json().catch(()=>({}));if(!r.ok||!d.success)throw new Error(d.error||'Invalid username or password');window.location.replace('/admin')}catch(err){error.textContent=err.message;button.disabled=false;button.textContent='Sign in'}});
    document.getElementById('username').focus();
  </script>
</body>
</html>
