<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DFFDF Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 20% 10%, rgba(124, 92, 255, .2), transparent 35%),
        radial-gradient(circle at 90% 80%, rgba(0, 200, 255, .08), transparent 30%),
        #07070b;
      color: #fff;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button, input, textarea {
      font: inherit;
    }

    .login-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .login-card {
      width: 100%;
      max-width: 430px;
      padding: 38px;
      background: rgba(18, 18, 27, .88);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 24px;
      box-shadow: 0 30px 100px rgba(0,0,0,.5);
      backdrop-filter: blur(20px);
    }

    .brand {
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      margin-bottom: 25px;
      border-radius: 16px;
      background: linear-gradient(135deg, #8065ff, #4c36d9);
      font-weight: 900;
      font-size: 20px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 32px;
      letter-spacing: -1.5px;
    }

    .subtitle {
      margin: 0 0 30px;
      color: #9496a5;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      color: #c8c9d1;
      font-size: 13px;
      font-weight: 600;
    }

    input, textarea {
      width: 100%;
      padding: 14px 15px;
      color: #fff;
      background: #0b0c11;
      border: 1px solid #292b36;
      border-radius: 12px;
      outline: none;
      transition: .2s;
    }

    input:focus, textarea:focus {
      border-color: #8065ff;
      box-shadow: 0 0 0 3px rgba(128,101,255,.12);
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    .primary {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, #8065ff, #5c42e8);
      color: white;
      font-weight: 800;
      cursor: pointer;
      transition: .2s;
    }

    .primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(92,66,232,.3);
    }

    .primary:disabled {
      opacity: .6;
      cursor: wait;
    }

    .error {
      margin-top: 15px;
      color: #ff7788;
      font-size: 14px;
    }

    .success {
      margin-top: 15px;
      color: #69e59a;
      font-size: 14px;
    }

    .dashboard {
      display: none;
      max-width: 1050px;
      margin: auto;
      padding: 35px 22px 80px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 25px;
    }

    .topbar h1 {
      font-size: 38px;
    }

    .logout {
      padding: 11px 16px;
      border: 1px solid #30323d;
      border-radius: 10px;
      background: #11121a;
      color: white;
      cursor: pointer;
    }

    .panel {
      padding: 30px;
      margin-bottom: 20px;
      background: rgba(17,18,26,.9);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 20px;
    }

    .panel h2 {
      margin: 0 0 20px;
      font-size: 21px;
    }

    .service {
      padding: 20px;
      margin-bottom: 15px;
      background: #0b0c11;
      border: 1px solid #272a35;
      border-radius: 14px;
    }

    .remove {
      margin-top: 12px;
      padding: 9px 13px;
      border: 0;
      border-radius: 9px;
      background: #8e2e42;
      color: white;
      cursor: pointer;
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 25px;
    }

    .save {
      padding: 13px 20px;
      border: 0;
      border-radius: 11px;
      background: #8065ff;
      color: white;
      font-weight: 800;
      cursor: pointer;
    }

    .view {
      display: inline-flex;
      align-items: center;
      padding: 13px 20px;
      border: 1px solid #30323d;
      border-radius: 11px;
      color: white;
    }

    @media (max-width: 600px) {
      .login-card {
        padding: 28px 22px;
      }

      .panel {
        padding: 22px;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <section id="loginPage" class="login-page">
    <div class="login-card">

      <div class="brand">D</div>

      <h1>Welcome back</h1>

      <p class="subtitle">
        Sign in to manage your DFFDF website.
      </p>

      <form id="loginForm">

        <label for="username">Username</label>
        <input
          id="username"
          type="text"
          autocomplete="username"
          required
        >

        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          autocomplete="current-password"
          required
        >

        <button
          id="loginButton"
          class="primary"
          type="submit"
        >
          Sign In
        </button>

        <div id="loginMessage"></div>

      </form>
    </div>
  </section>


  <main id="dashboard" class="dashboard">

    <div class="topbar">

      <div>
        <h1>Dashboard</h1>
        <p class="subtitle">Manage your website content.</p>
      </div>

      <button id="logoutButton" class="logout">
        Log out
      </button>

    </div>


    <section class="panel">

      <h2>Website</h2>

      <label>Site Name</label>
      <input id="siteName">

    </section>


    <section class="panel">

      <h2>Hero Section</h2>

      <label>Title</label>
      <input id="heroTitle">

      <label>Description</label>
      <textarea id="heroText"></textarea>

      <label>Button Text</label>
      <input id="heroButton">

    </section>


    <section class="panel">

      <h2>About</h2>

      <label>Title</label>
      <input id="aboutTitle">

      <label>Description</label>
      <textarea id="aboutText"></textarea>

    </section>


    <section class="panel">

      <h2>Services</h2>

      <div id="services"></div>

      <button id="addService" class="save" type="button">
        + Add Service
      </button>

    </section>


    <section class="panel">

      <h2>Contact</h2>

      <label>Title</label>
      <input id="contactTitle">

      <label>Description</label>
      <textarea id="contactText"></textarea>

      <label>Email</label>
      <input id="contactEmail" type="email">

    </section>


    <section class="panel">

      <h2>Footer</h2>

      <input id="footer">

      <div class="actions">

        <button id="saveButton" class="save">
          Publish Changes
        </button>

        <a href="/" target="_blank" class="view">
          View Website ↗
        </a>

      </div>

      <div id="message"></div>

    </section>

  </main>


<script>

let siteData = null;

const $ = id => document.getElementById(id);


async function checkSession() {

  try {

    const response = await fetch("/api/admin/session");
    const data = await response.json();

    if (data.authenticated) {
      await showDashboard();
    }

  } catch (error) {
    console.error(error);
  }

}


$("loginForm").addEventListener("submit", async function(event) {

  event.preventDefault();

  const button = $("loginButton");
  const message = $("loginMessage");

  button.disabled = true;
  button.textContent = "Signing in...";
  message.className = "";
  message.textContent = "";

  try {

    const response = await fetch("/api/login", {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        username: $("username").value.trim(),
        password: $("password").value
      })

    });

    const data = await response.json();

    if (!response.ok || !data.success) {

      message.className = "error";
      message.textContent =
        data.error || "Login failed.";

      button.disabled = false;
      button.textContent = "Sign In";

      return;
    }

    await showDashboard();

  } catch (error) {

    message.className = "error";
    message.textContent =
      "Unable to connect to the server.";

    button.disabled = false;
    button.textContent = "Sign In";

  }

});


async function showDashboard() {

  const response =
    await fetch("/api/admin/content");

  if (!response.ok) {

    $("loginMessage").textContent =
      "Unable to load the dashboard.";

    return;

  }

  siteData =
    await response.json();

  $("loginPage").style.display = "none";
  $("dashboard").style.display = "block";

  populate();

}


function populate() {

  $("siteName").value =
    siteData.siteName || "";

  $("heroTitle").value =
    siteData.heroTitle || "";

  $("heroText").value =
    siteData.heroText || "";

  $("heroButton").value =
    siteData.heroButton || "";

  $("aboutTitle").value =
    siteData.aboutTitle || "";

  $("aboutText").value =
    siteData.aboutText || "";

  $("contactTitle").value =
    siteData.contactTitle || "";

  $("contactText").value =
    siteData.contactText || "";

  $("contactEmail").value =
    siteData.contactEmail || "";

  $("footer").value =
    siteData.footer || "";

  renderServices();

}


function renderServices() {

  const container = $("services");

  container.innerHTML = "";

  siteData.services.forEach((service, index) => {

    const wrapper =
      document.createElement("div");

    wrapper.className = "service";

    const title =
      document.createElement("input");

    title.value =
      service.title || "";

    title.placeholder =
      "Service title";

    title.addEventListener("input", () => {
      siteData.services[index].title =
        title.value;
    });


    const text =
      document.createElement("textarea");

    text.value =
      service.text || "";

    text.placeholder =
      "Service description";

    text.addEventListener("input", () => {
      siteData.services[index].text =
        text.value;
    });


    const remove =
      document.createElement("button");

    remove.type = "button";
    remove.className = "remove";
    remove.textContent = "Remove";

    remove.addEventListener("click", () => {

      siteData.services.splice(index, 1);

      renderServices();

    });


    const titleLabel =
      document.createElement("label");

    titleLabel.textContent =
      "Title";


    const textLabel =
      document.createElement("label");

    textLabel.textContent =
      "Description";


    wrapper.appendChild(titleLabel);
    wrapper.appendChild(title);
    wrapper.appendChild(textLabel);
    wrapper.appendChild(text);
    wrapper.appendChild(remove);

    container.appendChild(wrapper);

  });

}


$("addService").addEventListener("click", () => {

  siteData.services.push({
    title: "New Service",
    text: "Describe this service."
  });

  renderServices();

});


$("saveButton").addEventListener("click", async () => {

  siteData.siteName =
    $("siteName").value;

  siteData.heroTitle =
    $("heroTitle").value;

  siteData.heroText =
    $("heroText").value;

  siteData.heroButton =
    $("heroButton").value;

  siteData.aboutTitle =
    $("aboutTitle").value;

  siteData.aboutText =
    $("aboutText").value;

  siteData.contactTitle =
    $("contactTitle").value;

  siteData.contactText =
    $("contactText").value;

  siteData.contactEmail =
    $("contactEmail").value;

  siteData.footer =
    $("footer").value;


  const button =
    $("saveButton");

  button.disabled = true;
  button.textContent = "Publishing...";


  try {

    const response =
      await fetch("/api/admin/save", {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          content: siteData
        })

      });


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.error || "Publish failed."
      );

    }


    $("message").className = "success";
    $("message").textContent =
      "✓ Published successfully!";

  } catch (error) {

    $("message").className = "error";
    $("message").textContent =
      error.message;

  } finally {

    button.disabled = false;
    button.textContent = "Publish Changes";

  }

});


$("logoutButton").addEventListener("click", async () => {

  await fetch("/api/logout", {
    method: "POST"
  });

  location.reload();

});


checkSession();

</script>

</body>
</html>
