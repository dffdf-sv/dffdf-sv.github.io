<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>DFFDF</title>

<style>

:root{
  --bg:#07070b;
  --surface:#11121a;
  --text:#fff;
  --muted:#999baa;
  --accent:#8065ff;
  --accent2:#b19cff;
  --border:rgba(255,255,255,.1);
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  min-height:100vh;

  color:var(--text);

  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background:
    radial-gradient(
      circle at 10% 10%,
      color-mix(
        in srgb,
        var(--accent) 24%,
        transparent
      ),
      transparent 30%
    ),
    radial-gradient(
      circle at 90% 80%,
      color-mix(
        in srgb,
        var(--accent2) 15%,
        transparent
      ),
      transparent 30%
    ),
    var(--bg);

  transition:
    background .35s,
    color .35s;

  overflow-x:hidden;
}

a{
  color:inherit;
  text-decoration:none;
}

.glass{
  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.09),
      rgba(255,255,255,.025)
    );

  border:
    1px solid var(--border);

  backdrop-filter:
    blur(30px)
    saturate(140%);

  -webkit-backdrop-filter:
    blur(30px)
    saturate(140%);

  box-shadow:
    inset 0 1px rgba(255,255,255,.08),
    0 30px 80px rgba(0,0,0,.2);
}

nav{
  position:sticky;

  top:14px;

  z-index:50;

  width:min(1180px,calc(100% - 28px));

  margin:14px auto;

  padding:12px 15px;

  border-radius:18px;

  display:flex;

  align-items:center;

  justify-content:space-between;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:900;
}

.logo-mark{
  width:34px;
  height:34px;

  display:grid;
  place-items:center;

  border-radius:11px;

  background:
    linear-gradient(
      135deg,
      var(--accent),
      var(--accent2)
    );
}

.links{
  display:flex;
  align-items:center;
  gap:8px;
}

.links a,
.theme{
  padding:9px 12px;
  border-radius:10px;
  color:var(--muted);
  font-size:13px;
}

.links a:hover,
.theme:hover{
  color:var(--text);
  background:rgba(255,255,255,.06);
}

.theme{
  border:1px solid var(--border);
  background:transparent;
  cursor:pointer;
}

main{
  width:min(1180px,calc(100% - 28px));
  margin:auto;
}

.hero{
  min-height:76vh;

  display:grid;
  place-items:center;

  text-align:center;

  padding:100px 20px;
}

.hero-box{
  max-width:950px;
}

.badge{
  display:inline-flex;

  padding:8px 13px;

  border-radius:999px;

  color:var(--muted);

  font-size:11px;

  letter-spacing:2px;

  background:rgba(255,255,255,.04);

  border:1px solid var(--border);
}

.hero h1{
  margin:25px 0;

  font-size:
    clamp(52px,8vw,105px);

  line-height:.94;

  letter-spacing:-6px;
}

.hero h1 span,
.section h2 span{
  color:var(--accent);

  text-shadow:
    0 0 50px
    color-mix(
      in srgb,
      var(--accent) 40%,
      transparent
    );
}

.hero p{
  max-width:650px;

  margin:0 auto 30px;

  color:var(--muted);

  font-size:18px;
}

.buttons{
  display:flex;

  justify-content:center;

  gap:12px;

  flex-wrap:wrap;
}

.btn{
  padding:13px 18px;

  border-radius:12px;

  border:1px solid var(--border);

  background:rgba(255,255,255,.04);

  font-weight:800;
}

.btn.primary{
  border:0;

  color:#fff;

  background:
    linear-gradient(
      135deg,
      var(--accent),
      var(--accent2)
    );

  box-shadow:
    0 18px 45px
    color-mix(
      in srgb,
      var(--accent) 30%,
      transparent
    );
}

.section{
  padding:100px 0;
}

.section-card{
  padding:35px;

  border-radius:26px;
}

.section h2{
  font-size:
    clamp(40px,6vw,72px);

  line-height:1;

  letter-spacing:-4px;

  margin:0 0 25px;
}

.section p{
  color:var(--muted);

  font-size:18px;

  line-height:1.7;
}

.section-image{
  width:100%;

  max-height:550px;

  object-fit:cover;

  border-radius:22px;

  margin-top:25px;
}

.cards{
  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:16px;

  margin-top:35px;
}

.card{
  padding:28px;

  min-height:220px;

  border-radius:22px;

  transition:
    transform .25s,
    border-color .25s;
}

.card:hover{
  transform:translateY(-7px);

  border-color:
    color-mix(
      in srgb,
      var(--accent) 55%,
      transparent
    );
}

.card-icon{
  width:45px;
  height:45px;

  display:grid;
  place-items:center;

  border-radius:13px;

  color:var(--accent);

  background:
    color-mix(
      in srgb,
      var(--accent) 13%,
      transparent
    );

  margin-bottom:30px;
}

.card h3{
  font-size:22px;
}

.contact{
  text-align:center;
  padding:130px 20px;
}

.contact .section-card{
  max-width:850px;
  margin:auto;
}

footer{
  width:min(1180px,calc(100% - 28px));

  margin:auto;

  padding:35px 0;

  border-top:
    1px solid var(--border);

  color:var(--muted);

  font-size:12px;

  display:flex;

  justify-content:space-between;

  gap:20px;
}

@media(max-width:750px){

  .links a{
    display:none;
  }

  .hero h1{
    letter-spacing:-3px;
  }

  .cards{
    grid-template-columns:1fr;
  }

  .section{
    padding:70px 0;
  }

  footer{
    flex-direction:column;
  }
}

</style>
</head>

<body>

<nav class="glass">

  <a
    href="/"
    class="logo"
  >
    <span class="logo-mark">
      D
    </span>

    <span id="siteName">
      DFFDF
    </span>
  </a>


  <div
    id="navLinks"
    class="links"
  ></div>


  <button
    id="themeButton"
    class="theme"
  >
    ◐ Default
  </button>

</nav>


<main id="content">

  <section class="hero">

    <div class="hero-box">

      <div
        id="badge"
        class="badge"
      ></div>

      <h1 id="heroTitle"></h1>

      <p id="heroText"></p>

      <div
        id="heroButtons"
        class="buttons"
      ></div>

    </div>

  </section>


  <div id="sections"></div>

</main>


<footer>

  <span id="footer">
    © 2026 DFFDF
  </span>

  <span>
    Liquid Glass
  </span>

</footer>


<script>

let site;
let page;
const themes = {
  midnight: {
    background: "#07070b",
    surface: "#11121a",
    text: "#ffffff",
    muted: "#999baa",
    accent: "#8065ff",
    accent2: "#b19cff",
    border: "rgba(255,255,255,.12)"
  },

  aurora: {
    background: "#06100e",
    surface: "#0d1c19",
    text: "#ffffff",
    muted: "#9bb8af",
    accent: "#48e6b2",
    accent2: "#9bffe0",
    border: "rgba(72,230,178,.18)"
  },

  ocean: {
    background: "#06101a",
    surface: "#0d1925",
    text: "#ffffff",
    muted: "#9bb2c7",
    accent: "#38a9ff",
    accent2: "#8bd1ff",
    border: "rgba(56,169,255,.18)"
  },

  sunset: {
    background: "#13090d",
    surface: "#211117",
    text: "#ffffff",
    muted: "#c4a1aa",
    accent: "#ff6b7a",
    accent2: "#ffb36b",
    border: "rgba(255,107,122,.18)"
  },

  light: {
    background: "#f4f5f8",
    surface: "#ffffff",
    text: "#101015",
    muted: "#686975",
    accent: "#6246e8",
    accent2: "#927cff",
    border: "rgba(20,20,30,.12)"
  }
};

const themeLabels = {
  midnight: "🌑 Midnight",
  aurora: "🌌 Aurora",
  ocean: "🌊 Ocean",
  sunset: "🌅 Sunset",
  light: "☀️ Light"
};


function setTheme(mode){

  let theme;

  if(mode === "light"){
    theme = themes.light;
  }

  else if(mode === "dark"){
    theme = themes.midnight;
  }

  else{

    const themeName =
      page.theme !== "inherit"
        ? page.theme
        : site.defaultTheme;

    theme =
      site.themes[
        themeName
      ] ||
      themes[
        themeName
      ] ||
      themes.midnight;
  }

  Object.entries(theme)
    .forEach(
      ([key,value]) => {

        document.documentElement
          .style
          .setProperty(
            `--${key}`,
            value
          );

      }
    );

  localStorage.setItem(
    "dffdf-visitor-theme",
    mode
  );

  document.getElementById(
    "themeButton"
  ).textContent =
    mode === "default"
      ? "◐ Default"
      : mode === "light"
        ? "☀ Light"
        : "☾ Dark";

}


document
  .getElementById(
    "themeButton"
  )
  .addEventListener(
    "click",
    () => {

      const current =
        localStorage.getItem(
          "dffdf-visitor-theme"
        ) || "default";

      const next =
        current === "default"
          ? "light"
          : current === "light"
            ? "dark"
            : "default";

      setTheme(next);

    }
  );


async function load(){

  const slug =
    location.pathname
      .replace(/^\/+/,"")
      .replace(/\/+$/,"") ||
    "home";

  const response =
    await fetch(
      `/api/site?page=${encodeURIComponent(slug)}`
    );

  if(!response.ok){

    document.getElementById(
      "content"
    ).innerHTML = `
      <section class="hero">
        <div class="hero-box">
          <h1>Page not found.</h1>
          <p>
            This page doesn't exist yet.
          </p>
          <a class="btn primary" href="/">
            Go Home
          </a>
        </div>
      </section>
    `;

    return;
  }

  const data =
    await response.json();

  site =
    data.site;

  page =
    data.page;


  document.title =
    `${page.title} · ${site.siteName}`;


  document.getElementById(
    "siteName"
  ).textContent =
    site.siteName;


  renderNavigation();

  renderPage();


  const saved =
    localStorage.getItem(
      "dffdf-visitor-theme"
    ) || "default";

  setTheme(saved);


  document.getElementById(
    "footer"
  ).textContent =
    `© 2026 ${site.siteName}. All rights reserved.`;

}


function renderNavigation(){

  const nav =
    document.getElementById(
      "navLinks"
    );

  nav.innerHTML = "";

  const items =
    site.navigation || [];

  items.forEach(item => {

    const a =
      document.createElement("a");

    a.href =
      item.href;

    a.textContent =
      item.label;

    nav.appendChild(a);

  });

}


function renderPage(){

  const sections =
    page.sections || [];

  const hero =
    sections.find(
      s => s.type === "hero"
    );

  if(hero){

    document.getElementById(
      "badge"
    ).textContent =
      hero.badge || "DFFDF";


    document.getElementById(
      "heroTitle"
    ).innerHTML =
      formatTitle(
        hero.title
      );


    document.getElementById(
      "heroText"
    ).textContent =
      hero.text || "";


    const buttons =
      document.getElementById(
        "heroButtons"
      );

    buttons.innerHTML = "";

    if(hero.buttonText){

      buttons.innerHTML = `
        <a
          class="btn primary"
          href="${safeAttr(hero.buttonUrl || "#")}"
        >
          ${escapeHTML(hero.buttonText)}
          →
        </a>
      `;

    }

  }


  const container =
    document.getElementById(
      "sections"
    );

  container.innerHTML = "";


  sections
    .filter(
      s => s.type !== "hero"
    )
    .forEach(
      renderSection
    );

}


function renderSection(section){

  const wrapper =
    document.createElement(
      "section"
    );

  wrapper.className =
    "section";


  if(section.type === "text"){

    wrapper.innerHTML = `
      <div class="section-card glass">
        <h2>
          ${formatTitle(section.title || "")}
        </h2>

        <p>
          ${escapeHTML(section.text || "")}
        </p>

        ${
          section.image
            ? `<img
                class="section-image"
                src="${safeAttr(section.image)}"
                alt=""
              >`
            : ""
        }
      </div>
    `;

  }


  else if(section.type === "image"){

    wrapper.innerHTML = `
      <div class="section-card glass">
        <h2>
          ${formatTitle(section.title || "")}
        </h2>

        ${
          section.image
            ? `<img
                class="section-image"
                src="${safeAttr(section.image)}"
                alt=""
              >`
            : ""
        }

        <p>
          ${escapeHTML(section.text || "")}
        </p>
      </div>
    `;

  }


  else if(section.type === "cards"){

    const cards =
      section.cards || [];

    wrapper.innerHTML = `
      <div class="section-card glass">

        <h2>
          ${formatTitle(section.title || "")}
        </h2>

        <p>
          ${escapeHTML(section.text || "")}
        </p>

        <div class="cards">

          ${cards.map(
            (card,index) => `

              <article class="card glass">

                <div class="card-icon">
                  ${["✦","◈","∞","◆"][index % 4]}
                </div>

                <h3>
                  ${escapeHTML(card.title || "")}
                </h3>

                <p>
                  ${escapeHTML(card.text || "")}
                </p>

              </article>

            `
          ).join("")}

        </div>

      </div>
    `;

  }


  else if(section.type === "contact"){

    wrapper.className =
      "contact";

    wrapper.innerHTML = `
      <div class="section-card glass">

        <h2>
          ${formatTitle(section.title || "")}
        </h2>

        <p>
          ${escapeHTML(section.text || "")}
        </p>

        ${
          section.email
            ? `
              <div class="buttons">
                <a
                  class="btn primary"
                  href="mailto:${safeAttr(section.email)}"
                >
                  ${escapeHTML(section.email)}
                  ↗
                </a>
              </div>
            `
            : ""
        }

      </div>
    `;

  }


  document
    .getElementById("sections")
    .appendChild(wrapper);

}


function formatTitle(value){

  const words =
    String(value || "")
      .trim()
      .split(/\s+/);

  if(words.length < 2)
    return escapeHTML(value);

  const last =
    escapeHTML(words.pop());

  return `
    ${escapeHTML(words.join(" "))}
    <span>${last}</span>
  `;

}


function escapeHTML(value){

  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function safeAttr(value){

  return escapeHTML(value)
    .replace(/javascript:/gi,"");

}


load();

</script>

</body>
</html>
