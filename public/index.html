<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" id="metaDescription" content="DFFDF">
  <link rel="icon" id="favicon" href="">
  <title id="pageTitle">DFFDF</title>

  <style>
    :root {
      --background:#07070b;
      --surface:#11121a;
      --text:#fff;
      --muted:#9b9ba8;
      --accent:#8065ff;
      --accent2:#b19cff;
      --border:rgba(255,255,255,.12);
      --glass-blur:30px;
      --glass-opacity:.09;
      --glass-border-opacity:.12;
      --glass-shadow:.20;
      --glass-radius:22px;
      --glass-animation:.25s;
      --glass-glow:.30;
    }

    * {
      box-sizing:border-box;
    }

    html {
      scroll-behavior:smooth;
    }

    body {
      margin:0;
      min-height:100vh;
      color:var(--text);
      background:
        radial-gradient(
          circle at 15% 10%,
          color-mix(in srgb,var(--accent) 18%,transparent),
          transparent 35%
        ),
        radial-gradient(
          circle at 85% 80%,
          color-mix(in srgb,var(--accent2) 14%,transparent),
          transparent 35%
        ),
        var(--background);
      font-family:
        Inter,ui-sans-serif,system-ui,-apple-system,
        BlinkMacSystemFont,"Segoe UI",sans-serif;
      transition:
        background var(--glass-animation),
        color var(--glass-animation);
    }

    a {
      color:inherit;
      text-decoration:none;
    }

    button {
      font:inherit;
    }

    .container {
      width:min(1120px,calc(100% - 32px));
      margin:auto;
    }

    .glass {
      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,var(--glass-opacity)),
          rgba(255,255,255,.025)
        );
      border:1px solid var(--border);
      backdrop-filter:
        blur(var(--glass-blur))
        saturate(140%);
      -webkit-backdrop-filter:
        blur(var(--glass-blur))
        saturate(140%);
      box-shadow:
        inset 0 1px rgba(255,255,255,.08),
        0 30px 80px rgba(0,0,0,var(--glass-shadow));
      border-radius:var(--glass-radius);
      transition:
        background var(--glass-animation),
        border-color var(--glass-animation),
        box-shadow var(--glass-animation),
        transform var(--glass-animation);
    }

    .glass:hover {
      transform:translateY(-2px);
    }

    header {
      position:sticky;
      top:12px;
      z-index:100;
      padding-top:12px;
    }

    .nav {
      min-height:64px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      padding:10px 14px;
    }

    .brand {
      display:flex;
      align-items:center;
      gap:12px;
      font-weight:800;
      white-space:nowrap;
    }

    .logo {
      width:42px;
      height:42px;
      display:grid;
      place-items:center;
      overflow:hidden;
      border-radius:14px;
      color:#fff;
      background:linear-gradient(
        135deg,
        var(--accent),
        var(--accent2)
      );
      box-shadow:
        0 12px 40px
        color-mix(
          in srgb,
          var(--accent)
          calc(var(--glass-glow) * 100%),
          transparent
        );
    }

    .logo img {
      width:100%;
      height:100%;
      object-fit:cover;
    }

    nav {
      display:flex;
      align-items:center;
      gap:5px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }

    nav a,
    .theme-button {
      border:0;
      color:var(--muted);
      background:transparent;
      padding:10px 13px;
      border-radius:12px;
      cursor:pointer;
      transition:.2s;
    }

    nav a:hover,
    .theme-button:hover {
      color:var(--text);
      background:rgba(255,255,255,.07);
    }

    main {
      padding:60px 0;
    }

    .section {
      margin:24px 0;
    }

    .hero {
      min-height:530px;
      display:grid;
      place-items:center;
      text-align:center;
      padding:70px 24px;
      position:relative;
      overflow:hidden;
    }

    .hero::before {
      content:"";
      position:absolute;
      width:380px;
      height:380px;
      border-radius:50%;
      background:var(--accent);
      opacity:.12;
      filter:blur(90px);
      pointer-events:none;
    }

    .hero-content {
      position:relative;
      z-index:1;
      max-width:820px;
    }

    .badge {
      display:inline-flex;
      padding:8px 14px;
      border-radius:999px;
      color:var(--accent2);
      background:rgba(255,255,255,.06);
      border:1px solid var(--border);
      font-size:.8rem;
      font-weight:700;
      letter-spacing:.08em;
      margin-bottom:20px;
    }

    h1 {
      margin:0 0 22px;
      font-size:clamp(2.7rem,8vw,6rem);
      line-height:.95;
      letter-spacing:-.06em;
    }

    h2 {
      margin:0 0 14px;
      font-size:clamp(2rem,5vw,3.2rem);
      letter-spacing:-.04em;
    }

    h3 {
      margin-top:0;
    }

    p {
      color:var(--muted);
      line-height:1.75;
    }

    .hero p {
      max-width:700px;
      margin:0 auto 28px;
      font-size:1.1rem;
    }

    .btn {
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:13px 20px;
      border-radius:14px;
      border:1px solid var(--border);
      font-weight:700;
      transition:.2s;
    }

    .btn:hover {
      transform:translateY(-2px);
    }

    .btn.primary {
      color:#fff;
      border:0;
      background:linear-gradient(
        135deg,
        var(--accent),
        var(--accent2)
      );
      box-shadow:
        0 18px 50px
        color-mix(
          in srgb,
          var(--accent)
          calc(var(--glass-glow) * 100%),
          transparent
        );
    }

    .text-section,
    .cards,
    .contact {
      padding:45px;
    }

    .text-section p {
      max-width:760px;
    }

    .section-heading {
      margin-bottom:25px;
    }

    .card-grid {
      display:grid;
      grid-template-columns:
        repeat(3,minmax(0,1fr));
      gap:16px;
    }

    .card {
      padding:25px;
      min-height:180px;
    }

    .card-icon {
      width:42px;
      height:42px;
      display:grid;
      place-items:center;
      border-radius:13px;
      margin-bottom:18px;
      color:var(--accent2);
      background:
        color-mix(
          in srgb,
          var(--accent) 15%,
          transparent
        );
    }

    .contact {
      text-align:center;
    }

    .contact p {
      max-width:650px;
      margin:0 auto 25px;
    }

    .contact-email {
      display:block;
      margin-top:16px;
      color:var(--accent2);
    }

    .loading {
      min-height:65vh;
      display:grid;
      place-items:center;
    }

    .spinner {
      width:45px;
      height:45px;
      border:3px solid rgba(255,255,255,.1);
      border-top-color:var(--accent);
      border-radius:50%;
      animation:spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform:rotate(360deg);
      }
    }

    .error {
      text-align:center;
      padding:80px 20px;
    }

    footer {
      padding:25px 0 45px;
      text-align:center;
      color:var(--muted);
      font-size:.9rem;
    }

    @media(max-width:800px) {
      .nav {
        align-items:flex-start;
      }

      nav a,
      .theme-button {
        padding:8px 9px;
        font-size:.85rem;
      }

      main {
        padding-top:35px;
      }

      .hero {
        min-height:470px;
      }

      .text-section,
      .cards,
      .contact {
        padding:28px 22px;
      }

      .card-grid {
        grid-template-columns:1fr;
      }
    }

    @media(prefers-reduced-motion:reduce) {
      *,
      *::before,
      *::after {
        animation-duration:.01ms!important;
        animation-iteration-count:1!important;
        transition-duration:.01ms!important;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="container">
    <div class="nav glass">

      <a class="brand" href="/">
        <div class="logo" id="logo">D</div>
        <span id="siteName">DFFDF</span>
      </a>

      <nav id="navigation">
        <button
          class="theme-button"
          id="themeButton"
          type="button"
        >
          ◐ Default
        </button>
      </nav>

    </div>
  </div>
</header>

<main id="content">
  <div class="loading">
    <div class="spinner"></div>
  </div>
</main>

<footer>
  <div class="container">
    © 2026 <span id="footerName">DFFDF</span>
  </div>
</footer>

<script>
"use strict";

const themes = {
  midnight: {
    background:"#07070b",
    surface:"#11121a",
    text:"#ffffff",
    muted:"#9b9ba8",
    accent:"#8065ff",
    accent2:"#b19cff",
    border:"rgba(255,255,255,.12)"
  },

  aurora: {
    background:"#06100e",
    surface:"#0d1c19",
    text:"#ffffff",
    muted:"#9bb8af",
    accent:"#48e6b2",
    accent2:"#9bffe0",
    border:"rgba(72,230,178,.18)"
  },

  ocean: {
    background:"#06101a",
    surface:"#0d1925",
    text:"#ffffff",
    muted:"#9bb2c7",
    accent:"#38a9ff",
    accent2:"#8bd1ff",
    border:"rgba(56,169,255,.18)"
  },

  sunset: {
    background:"#13090d",
    surface:"#211117",
    text:"#ffffff",
    muted:"#c4a1aa",
    accent:"#ff6b7a",
    accent2:"#ffb36b",
    border:"rgba(255,107,122,.18)"
  },

[data-theme="light"] {
  --background: #ffffff;
  --surface: rgba(255, 255, 255, 0.72);
  --text: #171717;
  --muted: #6b6b6b;
  --accent: #f5c400;
  --accent2: #ffd83d;
}

[data-theme="light"] .glass {
  background: rgba(255, 255, 255, 0.68);
  border-color: rgba(245, 196, 0, 0.28);
  box-shadow:
    0 12px 40px rgba(245, 196, 0, 0.10),
    0 4px 20px rgba(0, 0, 0, 0.06);
}
let site = {};
let page = {};

function escapeHTML(value) {
  const div = document.createElement("div");
  div.textContent = value ?? "";
  return div.innerHTML;
}

function setTheme(mode) {
  let theme;

  if (mode === "light") {
    theme = themes.light;
  } else if (mode === "dark") {
    theme = themes.midnight;
  } else {
    const themeName =
      page.theme &&
      page.theme !== "inherit"
        ? page.theme
        : site.defaultTheme || "midnight";

    theme =
      site.themes?.[themeName] ||
      themes[themeName] ||
      themes.midnight;
  }

  Object.entries(theme).forEach(
    ([key,value]) => {
      document.documentElement.style.setProperty(
        `--${key}`,
        value
      );
    }
  );

  const glass = site.glass || {};

  document.documentElement.style.setProperty(
    "--glass-blur",
    glass.blur || "30px"
  );

  document.documentElement.style.setProperty(
    "--glass-opacity",
    glass.transparency ?? ".09"
  );

  document.documentElement.style.setProperty(
    "--glass-border-opacity",
    glass.borderOpacity ?? ".12"
  );

  document.documentElement.style.setProperty(
    "--glass-shadow",
    glass.shadowStrength ?? ".20"
  );

  document.documentElement.style.setProperty(
    "--glass-radius",
    glass.cornerRadius || "22px"
  );

  document.documentElement.style.setProperty(
    "--glass-animation",
    glass.animationSpeed || ".25s"
  );

  document.documentElement.style.setProperty(
    "--glass-glow",
    glass.glowStrength ?? ".30"
  );

  localStorage.setItem(
    "dffdf-visitor-theme",
    mode
  );

  updateThemeButton(mode);
}

function updateThemeButton(mode) {
  const button =
    document.getElementById("themeButton");

  if (!button) return;

  if (mode === "light") {
    button.textContent = "☀ Light";
  } else if (mode === "dark") {
    button.textContent = "☾ Dark";
  } else {
    const name =
      page.theme &&
      page.theme !== "inherit"
        ? page.theme
        : site.defaultTheme || "midnight";

    const labels = {
      midnight:"🌑 Midnight",
      aurora:"🌌 Aurora",
      ocean:"🌊 Ocean",
      sunset:"🌅 Sunset",
      light:"☀ Light"
    };

    button.textContent =
      labels[name] || "◐ Default";
  }
}

function setupThemeButton() {
  const button =
    document.getElementById("themeButton");

  if (!button) return;

  button.addEventListener(
    "click",
    () => {
      const current =
        localStorage.getItem(
          "dffdf-visitor-theme"
        ) || "default";

      const next =
        current === "default"
          ? "light"
          : current === "light"
          ? "dark"
          : "default";

      setTheme(next);
    }
  );
}

function renderNavigation() {
  const nav =
    document.getElementById("navigation");

  nav.innerHTML = "";

  const links =
    Array.isArray(site.navigation)
      ? site.navigation
      : [
          {label:"Home",href:"/"},
          {label:"Example",href:"/example"}
        ];

  links.forEach(link => {
    const a =
      document.createElement("a");

    a.href = link.href || "/";
    a.textContent =
      link.label || "Page";

    nav.appendChild(a);
  });

  const button =
    document.createElement("button");

  button.id = "themeButton";
  button.className = "theme-button";
  button.type = "button";
  button.textContent = "◐ Default";

  nav.appendChild(button);

  setupThemeButton();

  const saved =
    localStorage.getItem(
      "dffdf-visitor-theme"
    ) || "default";

  setTheme(saved);
}

function renderHero(section) {
  return `
    <section class="hero glass section">
      <div class="hero-content">

        ${
          section.badge
            ? `
              <div class="badge">
                ${escapeHTML(section.badge)}
              </div>
            `
            : ""
        }

        <h1>
          ${escapeHTML(
            section.title ||
            page.title ||
            "Welcome"
          )}
        </h1>

        ${
          section.text
            ? `
              <p>
                ${escapeHTML(section.text)}
              </p>
            `
            : ""
        }

        ${
          section.buttonText
            ? `
              <a
                class="btn primary"
                href="${escapeHTML(
                  section.buttonUrl || "#"
                )}"
              >
                ${escapeHTML(section.buttonText)}
              </a>
            `
            : ""
        }

      </div>
    </section>
  `;
}

function renderText(section) {
  return `
    <section class="text-section glass section">
      <h2>
        ${escapeHTML(section.title || "")}
      </h2>

      <p>
        ${escapeHTML(section.text || "")}
      </p>
    </section>
  `;
}

function renderCards(section) {
  const cards =
    Array.isArray(section.cards)
      ? section.cards
      : [];

  return `
    <section class="cards glass section">

      <div class="section-heading">
        <h2>
          ${escapeHTML(section.title || "")}
        </h2>

        ${
          section.text
            ? `
              <p>
                ${escapeHTML(section.text)}
              </p>
            `
            : ""
        }
      </div>

      <div class="card-grid">

        ${cards.map((card,index) => `
          <article class="card glass">

            <div class="card-icon">
              ${index + 1}
            </div>

            <h3>
              ${escapeHTML(card.title || "")}
            </h3>

            <p>
              ${escapeHTML(card.text || "")}
            </p>

          </article>
        `).join("")}

      </div>
    </section>
  `;
}

function renderContact(section) {
  let email =
    section.email || "";

  email =
    email
      .replace(/^\[/,"")
      .replace(/\].*$/,"")
      .replace(/^mailto:/,"");

  return `
    <section class="contact glass section">

      <h2>
        ${escapeHTML(
          section.title || "Contact"
        )}
      </h2>

      <p>
        ${escapeHTML(section.text || "")}
      </p>

      ${
        email
          ? `
            <a
              class="btn primary"
              href="mailto:${escapeHTML(email)}"
            >
              Contact us
            </a>

            <a
              class="contact-email"
              href="mailto:${escapeHTML(email)}"
            >
              ${escapeHTML(email)}
            </a>
          `
          : ""
      }

    </section>
  `;
}

function renderSection(section) {
  if (!section) return "";

  switch(section.type) {
    case "hero":
      return renderHero(section);

    case "text":
      return renderText(section);

    case "cards":
      return renderCards(section);

    case "contact":
      return renderContact(section);

    default:
      return "";
  }
}

function renderPage() {
  const content =
    document.getElementById("content");

  const sections =
    Array.isArray(page.sections)
      ? page.sections
      : [];

  content.innerHTML =
    sections
      .map(renderSection)
      .join("");

  document.title =
    page.title ||
    site.siteName ||
    "DFFDF";

  document
    .getElementById("pageTitle")
    .textContent =
    page.title ||
    site.siteName ||
    "DFFDF";

  document
    .getElementById("metaDescription")
    .setAttribute(
      "content",
      page.description ||
      site.siteDescription ||
      "DFFDF"
    );
}

function renderSite() {
  const name =
    site.siteName || "DFFDF";

  document
    .getElementById("siteName")
    .textContent = name;

  document
    .getElementById("footerName")
    .textContent = name;

  if (site.logo) {
    document.getElementById("logo").innerHTML =
      `<img src="${escapeHTML(site.logo)}" alt="">`;
  }

  if (site.favicon) {
    document
      .getElementById("favicon")
      .href = site.favicon;
  }
}

function getSlug() {
  return location.pathname
    .replace(/^\/+/,"")
    .replace(/\/+$/,"") || "home";
}

async function load() {
  try {
    const slug = getSlug();

    const response =
      await fetch(
        `/api/site?page=${encodeURIComponent(slug)}`,
        {
          cache:"no-store",
          headers:{
            Accept:"application/json"
          }
        }
      );

    if (!response.ok) {
      throw new Error(
        `API returned HTTP ${response.status}`
      );
    }

    const data =
      await response.json();

    if (!data.site || !data.page) {
      throw new Error(
        "API response is missing site or page data."
      );
    }

    site = data.site;
    page = data.page;

    renderSite();
    renderNavigation();
    renderPage();

  } catch(error) {
    console.error(
      "DFFDF load error:",
      error
    );

    document.getElementById(
      "content"
    ).innerHTML = `
      <section class="error">

        <div
          class="glass"
          style="
            max-width:700px;
            margin:auto;
            padding:50px;
          "
        >

          <div class="badge">
            DFFDF
          </div>

          <h1>
            Something went wrong.
          </h1>

          <p>
            ${escapeHTML(error.message)}
          </p>

          <a
            class="btn primary"
            href="/"
          >
            Try Again
          </a>

        </div>

      </section>
    `;
  }
}

document.addEventListener(
  "DOMContentLoaded",
  () => {
    load();
  }
);
</script>

</body>
</html>
