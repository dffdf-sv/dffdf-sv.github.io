<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DFFDF Visual Editor</title><style>body{margin:0;font:15px system-ui;background:#08080c;color:#fff}.bar{padding:16px;display:flex;gap:12px;align-items:center;background:#111a;backdrop-filter:blur(18px);position:sticky;top:0}.grid{display:grid;grid-template-columns:230px 1fr;gap:14px;padding:14px}.glass,.block{background:#ffffff0b;border:1px solid #ffffff18;border-radius:18px;padding:14px}.presets button{display:block;width:100%;margin:7px 0;padding:11px;border-radius:12px;background:#ffffff0b;color:#fff;border:1px solid #ffffff18;text-align:left;cursor:pointer}.block{margin:12px 0;min-height:40px}.hero{font-size:38px;font-weight:800}.img{height:180px;display:grid;place-items:center;background:#ffffff08}.muted{color:#aaa}a{color:#fff}.ai{border-color:#8065ff}</style></head><body><div class="bar"><b>✦ Visual Editor</b><span class="muted">Build your page with presets</span><a href="/admin" style="margin-left:auto">← Admin</a></div><div class="grid"><aside class="glass"><b>Presets</b><div class="presets"><button data-t="hero">✦ Hero</button><button data-t="text">▤ Text Box</button><button data-t="image">▧ Image Box</button><button data-t="cards">▦ Cards</button><button data-t="button">↗ Button</button><button data-t="gallery">▤ Gallery</button><button data-t="video">▶ Video</button><button data-t="columns">▥ Two Columns</button><button data-t="quote">❝ Quote</button><button data-t="features">✧ Feature List</button><button data-t="faq">? FAQ</button><button data-t="divider">— Divider</button><button data-t="spacer">↕ Spacer</button><button class="ai" data-t="ai">✦ AI Bot</button></div></aside><main class="glass" id="canvas"><div class="block hero" contenteditable="true">Your hero headline</div><div class="block" contenteditable="true">Click to edit text.</div></main></div><script>const c=document.getElementById('canvas');const presets={hero:'<h1>Your Hero</h1><p>Hero subtitle</p>',text:'New text box — click to edit.',image:'<div class="img">Image placeholder</div>',cards:'<h3>Cards</h3><p>Card content</p>',button:'<button>Call to action</button>',gallery:'<h3>Gallery</h3><p>Gallery content</p>',video:'<div class="img">Video placeholder</div>',columns:'<div><b>Column 1</b><p>Edit content</p></div><div><b>Column 2</b><p>Edit content</p></div>',quote:'<blockquote>“Your quote here.”</blockquote>',features:'<h3>Features</h3><ul><li>Feature one</li><li>Feature two</li><li>Feature three</li></ul>',faq:'<h3>FAQ</h3><p><b>Question?</b></p><p>Answer...</p>',divider:'<hr>',spacer:'&nbsp;',ai:'<h3>✦ AI Bot</h3><p>AI assistant placeholder — connect your AI service to make this live.</p>'};document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{const x=document.createElement('div');x.className='block';x.contentEditable=true;x.innerHTML=presets[b.dataset.t];c.appendChild(x)});</script></body></html>
