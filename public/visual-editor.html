<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DFFDF Visual Editor</title><style>body{margin:0;font:15px system-ui;background:#08080c;color:#fff}.bar{padding:16px;display:flex;gap:12px;align-items:center;background:#111a;backdrop-filter:blur(18px);position:sticky;top:0}.grid{display:grid;grid-template-columns:220px 1fr;gap:14px;padding:14px}.glass,.block{background:#ffffff0b;border:1px solid #ffffff18;border-radius:18px;padding:14px}.presets button{display:block;width:100%;margin:8px 0;padding:12px;border-radius:12px;background:#ffffff0b;color:#fff;border:1px solid #ffffff18;text-align:left;cursor:pointer}.block{margin:12px 0;min-height:40px}.hero{font-size:38px;font-weight:800}.img{height:180px;display:grid;place-items:center;background:#ffffff08}.save{background:#8065ff!important;text-align:center!important}a{color:#fff}.muted{color:#aaa}</style></head><body><div class="bar"><b>✦ Visual Editor</b><span class="muted">Add and edit page blocks</span><a href="/admin" style="margin-left:auto">← Admin</a></div><div class="grid"><aside class="glass"><b>Presets</b><div class="presets"><button data-t="hero">✦ Hero</button><button data-t="text">▤ Text Box</button><button data-t="image">▧ Image Box</button><button data-t="cards">▦ Cards</button><button data-t="button">↗ Button</button><button data-t="gallery">▤ Gallery</button><button data-t="spacer">↕ Spacer</button></div></aside><main class="glass" id="canvas"><div class="block hero" contenteditable="true">Your hero headline</div><div class="block" contenteditable="true">Click to edit text.</div></main></div><script>const c=document.getElementById('canvas');document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{const x=document.createElement('div');x.className='block';x.contentEditable=true;x.innerHTML={hero:'New Hero',text:'New text box',image:'<div class="img">Image placeholder</div>',cards:'<h3>Cards</h3><p>Card content</p>',button:'<button>Button</button>',gallery:'<h3>Gallery</h3><p>Gallery content</p>',spacer:'&nbsp;'}[b.dataset.t];c.appendChild(x)});</script></body></html>
